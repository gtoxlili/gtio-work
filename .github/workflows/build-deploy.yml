name: Build and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  ARTIFACT_NAME: site-dist

jobs:
  verify:
    name: Verify and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # `git describe --tags` in vite.config.ts stamps __APP_VERSION__ into
          # the console note; a shallow clone would flatten every build to the
          # same short hash with no tag context.
          fetch-depth: 0

      - name: Setup pnpm
        # Version comes from `packageManager` in site/package.json rather than
        # `latest`: pnpm 11 moved settings out of package.json into
        # pnpm-workspace.yaml, so a floating major silently changed where the
        # build-script policy is read from. CI and a laptop now agree.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: site/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build production bundle
        run: pnpm build

      - name: Verify Worker HTTP behavior
        run: node edge/smoke.mjs

      - name: Pack static artifact
        run: tar -czf "../${ARTIFACT_NAME}.tar.gz" dist

      - name: Upload static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .
      - name: Publish media and Worker
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CI: "true"
        run: |
          tar -xzf "../${ARTIFACT_NAME}.tar.gz" -C .
          node edge/upload-media.mjs
          pnpm exec wrangler deploy
      - name: Probe published languages and media
        run: |
          curl -fsS https://www.gtio.work/ >/dev/null
          curl -fsS https://www.gtio.work/zh/ | grep -q 'lang="zh-CN"'
          rev="$(node -p 'JSON.parse(require("fs").readFileSync("src/data/film.json", "utf8")).rev')"
          curl -fsS "https://www.gtio.work/film/$rev/city.json" >/dev/null
