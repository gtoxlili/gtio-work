# www.gtio.work / gtio.work，静态直出。deploy/deploy.sh 把这份同步到服务器，
# 以这份为准。
#
#   · 构建产物 rsync 到 ~/nginx/html/www（容器内 /usr/share/nginx/html/www）
#   · 两份预渲染 HTML：index.en.html / index.zh.html；`/` 按 cookie → Accept-Language 选择
#     （Vary 标出），/en/ 与 /zh/ 是可分享的定向入口
#   · /assets 与 /film 内容哈希 → 一年 immutable；/img /gpu 30 天；HTML 壳 no-cache
#   · .br/.gz 预压缩兄弟文件由 brotli_static/gzip_static 直发（http 级已开）

# 语言协商：cookie 优先，其次 Accept-Language 首选项，默认英文。
map $http_accept_language $www_lang_header {
    default "en";
    "~*^\s*zh" "zh";
}
map $cookie_lang $www_lang {
    default $www_lang_header;
    "zh" "zh";
    "en" "en";
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name www.gtio.work gtio.work;

    ssl_certificate cert/cf-origin.pem;
    ssl_certificate_key cert/cf-origin.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_WWW:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_conf_command Options KTLS;
    ssl_early_data on;
    quic_retry on;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html/www;
    brotli_static on;
    gzip_static on;

    # 首页：按语言选预渲染文件，不重定向。
    location = / {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Language, Cookie" always;
        try_files /index.$www_lang.html /index.html =404;
    }
    location = /en/ { rewrite ^ /index.en.html last; }
    location = /zh/ { rewrite ^ /index.zh.html last; }
    location = /en  { return 301 /en/; }
    location = /zh  { return 301 /zh/; }
    location ~ ^/index\.(en|zh)\.html$ {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # Vite 内容哈希资产：一年 immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        try_files $uri =404;
    }
    # 图片与 GPU 纹理：内容稳定，30 天
    location ~ ^/(img|gpu)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        try_files $uri =404;
    }

    # 影片：路径里带内容哈希（/film/<rev>/…），重新剪片就是一条新路径，所以和
    # /assets 一样按一年 immutable 发。边缘那一层还需要 Cloudflare 上的 /film/*
    # 规则——.av1、.h264、.json 都不在它默认缓存的扩展名里，没有那条规则每个
    # 访客都会把整部片子从源站拉一遍。
    location ~ ^/film/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
